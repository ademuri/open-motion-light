; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:default]
platform = ststm32
board = generic_stm32l051k8u
framework = arduino
upload_protocol = custom
upload_command = stm32loader -p "/dev/ttyUSB0" --erase --write --verify "$SOURCE" --family L0 --swap-rts-dtr --baud 115200
;upload_protocol = stlink
monitor_speed = 115200
monitor_dtr = 1

# Build stamping
extra_scripts = pre:git_version.py

custom_nanopb_protos =
  +<proto/serial.proto>

build_flags =
  ; Add the include path for the generated Protobuf headers
  -I.pio/build/default/nanopb/proto
  ; USB-to-serial
  -DENABLE_HWSERIAL1
  -DPIN_SERIAL1_RX=PA10
  -DPIN_SERIAL1_TX=PA9

  ; The STM32 Arduino platform does a brute-force calculation for I2C timing,
  ; which is slow on this processor (multiple seconds). Statically set this
  ; value to avoid this expensive computation. See
  ; https://github.com/orgs/stm32duino/discussions/1450 and
  ; https://github.com/stm32duino/Arduino_Core_STM32/wiki/Custom-definitions#i2c-timing.
  ; To find this value, edit `libraries/Wire/src/utility/twi.c` to make
  ; `i2c_computeTiming` non-static, and declare it extern:
  ; 
  ; extern uint32_t i2c_computeTiming(/*clkSrcFreq=*/32000000, /*i2c_speed=400 kHz*/1);
  ;
  ; Then, print the result of calling this function at runtime, and use that here.
  -DI2C_TIMING_FM=0xB01626

  ; Note: this is just the FM value multiplied by two - we *shouldn't* need SM
  ; mode, so this should be OK. If we don't set this, I2C init still takes ~10
  ; seconds.
  -DI2C_TIMING_SM=0x1602C4C0

  ; This removes unused stuff at link time, which is needed to enable the serial
  ; port for debugging.
  -flto=auto

  -std=c++17

lib_ignore =
  fake-eeprom
  fake-serial-port
  fake-vcnl4020
  fake-stream

lib_deps = 
  https://github.com/ademuri/arduino-timer.git#d22369a ; 2024-10-26
  https://github.com/ademuri/smart-input-filter.git#5b61e49 ; 2026-09-14

  Wire@^1.0.0

  https://github.com/stm32duino/STM32LowPower.git@^2.0.0
  ; Needed for the above
  https://github.com/stm32duino/STM32RTC.git@^2.0.0

  nanopb/Nanopb@0.4.91

  ; Provided by the Arduino core
  EEPROM

[env:native]
platform = native
test_framework = googletest

custom_nanopb_protos =
  +<proto/serial.proto>

build_flags =
  -I.pio/build/native/nanopb/proto

  ; --- Sanitizers (Runtime Memory & UB Checks) ---
  ; AddressSanitizer: Catches out-of-bounds heap/stack/global accesses, use-after-free, and leaks
  -fsanitize=address
  ; UndefinedBehaviorSanitizer: Catches invalid bools/enums, integer overflow, null derefs, misalignment
  -fsanitize=undefined
  ; ASan extension: Catches pointer comparisons (<, <=, >, >=) between pointers to unrelated objects
  -fsanitize=pointer-compare
  ; ASan extension: Catches pointer subtractions (p1 - p2) between pointers to unrelated objects
  -fsanitize=pointer-subtract
  ; Fills uninitialized stack variables with 0xFE; traps invalid bools/enums in UBSan and exposes uninitialized reads
  -ftrivial-auto-var-init=pattern
 
  ; --- Standard Library & Buffer Hardening ---
  ; libstdc++ Debug Mode: Enables bounds checking on operator[] and catches iterator invalidation
  -D_GLIBCXX_DEBUG
  ; glibc hardening: Runtime and compile-time buffer overflow detection for libc calls (memcpy, snprintf, etc.)
  -D_FORTIFY_SOURCE=3
  ; Optimization level 1: Required for _FORTIFY_SOURCE dataflow analysis while maintaining test debuggability
  -O1
  ; Preserves stack frame pointers for clean, accurate sanitizer backtraces and stack unwinding
  -fno-omit-frame-pointer
 
  ; --- Static Compiler Diagnostics (Compile-Time Warnings) ---
  ; Static analysis: Warns when accessing memory after it has been freed
  -Wuse-after-free=3
  ; Static analysis: Warns when a pointer points to an object whose scope or lifetime has ended
  -Wdangling-pointer=2
  ; Static analysis: Warns if code paths can dereference a null pointer
  -Wnull-dereference

  ; Generate debug symbols
	-g

  ; Link in the ASAN and UBSAN runtime libraries
  -lasan
  -lubsan

  -std=c++17
  -DFIRMWARE_VERSION="\"v1.0.0\""
  -DHOST
  -DEXTENDED_PIN_MODE

lib_deps =
  https://github.com/ademuri/arduino-timer.git#d22369a ; 2024-10-26
  https://github.com/ademuri/smart-input-filter.git#5b61e49 ; 2026-09-14
  nanopb/Nanopb@0.4.91
  https://github.com/ademuri/ArduinoCore-API-STM32.git#b26d3a6 ; 2026-09-06
